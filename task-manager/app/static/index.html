<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1>Task Manager</h1>
    <div class="header-actions">
      <button class="btn btn-sm btn-secondary" id="reportBtn" title="Weekly Report">Weekly Report</button>
      <button class="notification-bell" id="notifBell" title="Notifications">
        &#128276;
        <span class="notification-badge" id="notifBadge" style="display:none">0</span>
      </button>
      <div class="user-info" id="userInfo">
        <span id="currentUserName">-</span>
      </div>
    </div>
  </header>

  <!-- Board -->
  <div class="board" id="board"></div>

  <!-- Notification Panel -->
  <div class="notification-panel" id="notifPanel">
    <div class="notification-panel-header">
      <span>Notifications</span>
      <button class="btn btn-sm btn-secondary" id="markAllRead">Mark all read</button>
    </div>
    <div id="notifList"></div>
  </div>

  <!-- Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <h2 id="taskModalTitle">New Task</h2>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <input type="hidden" id="taskStatus">
        <div class="form-group">
          <label for="taskTitle">Title *</label>
          <input type="text" id="taskTitle" required placeholder="Enter task title">
        </div>
        <div class="form-group">
          <label for="taskDesc">Description</label>
          <textarea id="taskDesc" placeholder="Task description..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority">
              <option value="LOW">Low</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HIGH">High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskAssignee">Assignee</label>
            <select id="taskAssignee">
              <option value="">Unassigned</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taskDueDate">Due Date</label>
            <input type="date" id="taskDueDate">
          </div>
          <div class="form-group">
            <label for="taskTags">Tags (comma separated)</label>
            <input type="text" id="taskTags" placeholder="UI, Icon, Research">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taskFigma">Figma URL</label>
            <input type="url" id="taskFigma" placeholder="https://figma.com/...">
          </div>
          <div class="form-group">
            <label for="taskConfluence">Confluence URL</label>
            <input type="url" id="taskConfluence" placeholder="https://confluence...">
          </div>
        </div>
        <div class="form-group">
          <label>Cover Image</label>
          <div class="image-upload-area" id="imageUploadArea">
            Click to upload image or drag & drop
            <input type="file" id="imageInput" accept="image/*" style="display:none">
          </div>
          <img class="image-preview" id="imagePreview" style="display:none">
        </div>

        <!-- Comments (only shown when editing) -->
        <div class="comments-section" id="commentsSection" style="display:none">
          <h3>Comments</h3>
          <div id="commentsList"></div>
          <div class="comment-input-row" style="position:relative">
            <input type="text" id="commentInput" placeholder="Add a comment... (use @ to mention)">
            <button type="button" class="btn btn-sm btn-primary" id="addCommentBtn">Post</button>
            <div class="mention-dropdown" id="mentionDropdown"></div>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-danger" id="deleteTaskBtn" style="display:none;margin-right:auto">Delete</button>
          <button type="button" class="btn btn-secondary" id="cancelTaskBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Report Modal -->
  <div class="modal-overlay" id="reportModal">
    <div class="modal" style="max-width:720px">
      <h2>Weekly Report</h2>

      <!-- Template Section -->
      <div class="form-group">
        <label>Example Report Template</label>
        <textarea id="reportTemplate" rows="6" placeholder="예시 주간보고서를 붙여넣으세요. LLM이 이 형식을 따라 보고서를 생성합니다."></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button type="button" class="btn btn-sm btn-secondary" id="saveTemplateBtn">Save Template</button>
          <button type="button" class="btn btn-sm btn-secondary" id="loadTemplateBtn">Load Saved</button>
        </div>
      </div>

      <!-- Period Selection -->
      <div class="form-row">
        <div class="form-group">
          <label>Period (days)</label>
          <select id="reportDays">
            <option value="7" selected>Last 7 days</option>
            <option value="14">Last 14 days</option>
            <option value="30">Last 30 days</option>
          </select>
        </div>
        <div class="form-group" style="display:flex;align-items:flex-end">
          <button type="button" class="btn btn-primary" id="generateReportBtn" style="width:100%">Generate Report</button>
        </div>
      </div>

      <!-- Changes Preview -->
      <div class="form-group" id="changesPreviewGroup" style="display:none">
        <label>Task Changes (<span id="changesCount">0</span>)</label>
        <div id="changesPreview" class="changes-preview"></div>
      </div>

      <!-- Generated Report -->
      <div class="form-group" id="reportResultGroup" style="display:none">
        <label>Generated Report</label>
        <div id="reportResult" class="report-result"></div>
        <button type="button" class="btn btn-sm btn-secondary" id="copyReportBtn" style="margin-top:8px">Copy to Clipboard</button>
      </div>

      <!-- Loading -->
      <div id="reportLoading" style="display:none;text-align:center;padding:20px;color:var(--text-muted)">
        Generating report...
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="closeReportBtn">Close</button>
      </div>
    </div>
  </div>

  <!-- Nickname Modal -->
  <div class="modal-overlay" id="nicknameModal">
    <div class="modal nickname-modal">
      <h2>Welcome!</h2>
      <p>Enter your nickname to get started</p>
      <div class="form-group">
        <input type="text" id="nicknameInput" placeholder="Your nickname" maxlength="50">
      </div>
      <div class="form-group">
        <input type="email" id="emailInput" placeholder="Email (optional, for notifications)">
      </div>
      <button class="btn btn-primary" id="nicknameSubmit" style="width:100%">Start</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
